name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Sắp xếp file (nếu tải lên bị dồn chung một chỗ)
        shell: python3 {0}
        run: |
          import os, glob, shutil, struct
          def png_w(p):
              with open(p, 'rb') as f: d = f.read(24)
              return struct.unpack('>I', d[16:20])[0] if d[:8] == b'\x89PNG\r\n\x1a\n' else None
          def put(src, dst):
              if os.path.exists(dst): return
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copy(src, dst); print(f'{src}  ->  {dst}')
          if os.path.exists('index.html'): put('index.html', 'www/index.html')
          if os.path.exists('tina.keystore'): put('tina.keystore', 'keystore/tina.keystore')
          legacy = {48: 'mdpi', 72: 'hdpi', 96: 'xhdpi', 144: 'xxhdpi', 192: 'xxxhdpi'}
          fore = {108: 'mdpi', 162: 'hdpi', 216: 'xhdpi', 324: 'xxhdpi', 432: 'xxxhdpi'}
          for f in sorted(glob.glob('*.png')):
              n, w = os.path.basename(f), png_w(f)
              if n.startswith('splash_land'): put(f, 'resources/android/splash_land.png')
              elif n.startswith('splash_port'): put(f, 'resources/android/splash_port.png')
              elif n.startswith('ic_launcher_foreground') and w in fore:
                  put(f, f'resources/android/mipmap-{fore[w]}/ic_launcher_foreground.png')
              elif n.startswith('ic_launcher_round') and w in legacy:
                  put(f, f'resources/android/mipmap-{legacy[w]}/ic_launcher_round.png')
              elif n.startswith('ic_launcher') and w in legacy:
                  put(f, f'resources/android/mipmap-{legacy[w]}/ic_launcher.png')

      - name: Kiểm tra file trong repo
        run: |
          echo "Các file đang có trong repo:"; find . -path ./.git -prune -o -type f -print | sort
          for f in package.json capacitor.config.json www/index.html; do
            [ -f "$f" ] || { echo "::error::Thiếu file bắt buộc: $f"; exit 1; }
          done
          [ -d resources/android ] || echo "::warning::Thiếu thư mục resources/android → app sẽ dùng icon mặc định"
          [ -f keystore/tina.keystore ] || echo "::warning::Thiếu keystore/tina.keystore → sẽ dùng khóa tạm, lần sau cài đè có thể không được"

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cài thư viện
        run: npm install

      - name: Tạo project Android
        run: npx cap add android

      - name: Áp icon, splash, màu, phiên bản
        run: |
          RES=android/app/src/main/res
          SRC=resources/android
          if [ -d "$SRC" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              [ -d "$SRC/mipmap-$d" ] && cp "$SRC/mipmap-$d/"*.png "$RES/mipmap-$d/" || true
            done
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#F5D55C</color>\n</resources>\n' > "$RES/values/ic_launcher_background.xml"
            [ -f "$SRC/splash_land.png" ] && find "$RES" -name 'splash.png' -path '*land*' -exec cp "$SRC/splash_land.png" {} \;
            [ -f "$SRC/splash_port.png" ] && find "$RES" -name 'splash.png' ! -path '*land*' -exec cp "$SRC/splash_port.png" {} \;
            echo "Đã áp icon và màn hình chờ"
          fi
          CODE="${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/; s/versionName \"[^\"]+\"/versionName \"1.0.${CODE}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Ký APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Dùng khóa trong Secrets nếu có, nếu không dùng khóa có sẵn trong thư mục keystore/
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          elif [ -f keystore/tina.keystore ]; then
            cp keystore/tina.keystore release.keystore
            KS_PASS=tina123456; KS_ALIAS=tina
          else
            KS_PASS=tina123456; KS_ALIAS=tina
            keytool -genkeypair -keystore release.keystore -alias tina -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=TINA Pet Spa, O=TINA, C=VN"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out "TINA-Pet-Spa-v1.0.${GITHUB_RUN_NUMBER}.apk" aligned.apk
          "$BT/apksigner" verify "TINA-Pet-Spa-v1.0.${GITHUB_RUN_NUMBER}.apk"
          rm -f release.keystore aligned.apk

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: TINA-Pet-Spa-APK
          path: TINA-Pet-Spa-*.apk
