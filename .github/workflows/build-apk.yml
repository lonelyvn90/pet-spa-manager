name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cài thư viện
        run: npm install

      - name: Tạo project Android
        run: npx cap add android

      - name: Áp icon, splash, màu, phiên bản
        run: bash scripts/customize-android.sh

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Ký APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Dùng khóa trong Secrets nếu có, nếu không dùng khóa có sẵn trong thư mục keystore/
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          else
            cp keystore/tina.keystore release.keystore
            KS_PASS=tina123456; KS_ALIAS=tina
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out "TINA-Pet-Spa-v1.0.${GITHUB_RUN_NUMBER}.apk" aligned.apk
          "$BT/apksigner" verify "TINA-Pet-Spa-v1.0.${GITHUB_RUN_NUMBER}.apk"
          rm -f release.keystore aligned.apk

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: TINA-Pet-Spa-APK
          path: TINA-Pet-Spa-*.apk
